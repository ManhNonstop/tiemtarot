stages:
  - lint
  - build
  - deploy

lint:php:
  stage: lint
  image: php:8.2-cli
  script:
    - echo "Running PHP syntax check..."
    - find themes/ plugins/ -name "*.php" -exec php -l {} \; || true

build:image:
  stage: build
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://localhost:2375
  before_script:
    - mkdir -p /etc/docker ~/.docker
    - echo gitlab.xroad.local:5050] > /etc/docker/daemon.json
    - echo gitlab.xroad.local:5050] > ~/.docker/daemon.json
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin registry.xroad.local:80
    - docker build -t registry.xroad.local:80/root/tiemtarot:latest -t registry.xroad.local:80/root/tiemtarot:$CI_COMMIT_SHORT_SHA .
    - docker push registry.xroad.local:80/root/tiemtarot:latest
    - docker push registry.xroad.local:80/root/tiemtarot:$CI_COMMIT_SHORT_SHA

deploy:dev:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - kubectl apply -f k8s/wordpress.yaml
    - kubectl rollout restart deployment/wordpress -n tiemtarot
