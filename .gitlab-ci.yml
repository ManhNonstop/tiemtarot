stages:
  - lint
  - build
  - deploy

lint:php:
  stage: lint
  image: php:8.2-cli
  script:
    - echo "Running PHP syntax check..."
    - find themes/ plugins/ -name "*.php" -exec php -l {} \; || true

build:image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"http://$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}:latest"
      --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      --insecure
      --skip-tls-verify

deploy:dev:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - kubectl apply -f k8s/wordpress.yaml
    - kubectl rollout restart deployment/wordpress -n tiemtarot
