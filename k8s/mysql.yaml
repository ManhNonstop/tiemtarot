apiVersion: v1
kind: Namespace
metadata:
  name: tiemtarot
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: tiemtarot
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "manhnonstop1"
  MYSQL_DATABASE: "tiemtarot_db"
  MYSQL_USER: "tiemtarot_db"
  MYSQL_PASSWORD: "manhnonstop1"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: tiemtarot
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-client
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: tiemtarot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mariadb:10.11
          envFrom:
            - secretRef:
                name: mysql-secret
          ports:
            - containerPort: 3306
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: mysql-storage
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: tiemtarot
spec:
  ports:
    - port: 3306
  selector:
    app: mysql
